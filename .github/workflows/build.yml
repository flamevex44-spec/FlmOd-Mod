name: Build FlameMod

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Rewrite gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2G
          mod_version=1.0.0
          maven_group=dev.flame
          archives_base_name=flamemod
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.16.14
          fabric_api_version=0.141.6+1.21.11
          loom_version=1.8.+
          PROPS

      - name: Rewrite build.gradle
        run: |
          cat > build.gradle << 'GRADLE'
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'java'
          }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories {
              maven { url = "https://maven.fabricmc.net/" }
              mavenCentral()
          }
          loom {
              mods {
                  flamemod {
                      sourceSet sourceSets.main
                  }
              }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
          }
          java {
              toolchain { languageVersion = JavaLanguageVersion.of(21) }
              withSourcesJar()
          }
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 21
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          jar {
              from("LICENSE") { rename { "${it}_${project.archives_base_name}" } }
          }
          GRADLE

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlameMod-JAR
          path: build/libs/*.jar
